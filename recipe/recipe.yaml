schema_version: 1

context:
  name: flux-core
  version: "0.88.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/flux-framework/flux-core/releases/download/v${{ version }}/flux-core-${{ version }}.tar.gz
  sha256: e7c5a48045a0574aa330f9bf94cad0a5de47f88c206f66387bfe8fd062c21a1c
  patches:
    - if: build_platform != target_platform
      then: centos6.patch
    - if: build_platform != target_platform
      then: cross-compiling.patch
    - disable-test-libeventlog-formatter.patch
    - disable-test-libsubprocess-stdio.patch
    - disable-test-t0005-exec.patch
    - disable-test-t0013-config-file.patch
    - disable-test-t0022-jj-reader.patch
    - disable-test-t0100-modprobe.patch
    - disable-test-t2406-job-exec-cleanup.patch
    - disable-test-t2500-job-attach.patch
    - disable-test-t2802-uri-cmd.patch
    - disable-test-python-t0002-wrapper.patch
    - if: match(python, "==3.14")
      then: disable-test-python-t1000-service-add-remove.patch

build:
  number: 1
  skip: not linux

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - make
    - automake =1.16
    - pkgconfig
    - jq
  host:
    - python
    - zeromq
    - lz4-c
    - libarchive
    - lua
    - libhwloc
    - libxml2-devel
    - sqlite
    - cffi
    - jsonschema
    - aspell
    - valgrind
    - pyyaml
    - czmq
    - jansson
    - setuptools
    - sphinx
    - ply
    - lua-luaposix
    - libuuid
    - ncurses
  run:
    - python
    - czmq
    - ${{ mpi }}
    - cffi
    - ply
    - lua-luaposix
    - pyyaml
    - jsonschema
  run_exports:
    - ${{ pin_subpackage('flux-core', upper_bound='x.x') }}

tests:
  - script:
      - flux --help

about:
  summary: core services for the Flux resource management framework
  description: |
    flux-core implements the lowest level services and interfaces for the
    Flux resource manager framework. It is intended to be the first
    building block used in the construction of a site-composed Flux
    resource manager.
  license: LGPL-3.0-or-later
  license_file: LICENSE
  homepage: https://flux-framework.org
  repository: https://github.com/flux-framework
  documentation: https://flux-framework.readthedocs.io/

extra:
  recipe-maintainers:
    - grondo
    - jan-janssen
